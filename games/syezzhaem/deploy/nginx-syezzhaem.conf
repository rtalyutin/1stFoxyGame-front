# Include this file inside the existing HTTPS server block.
# Include nginx-upstreams.conf separately inside the http block.
# Keep all existing first-game upstreams and locations unchanged.
# The parent directory is mounted read-only when nginx itself runs in Docker.
# Initial route installation needs nginx -t and a graceful reload once.
location = /games/syezzhaem { return 302 /games/syezzhaem/; }
location = /games/syezzhaem/ {
    alias /srv/foxygames/syezzhaem/index.html;
    open_file_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /games/syezzhaem/active.json {
    alias /srv/foxygames/syezzhaem/active.json;
    open_file_cache off;
    add_header Cache-Control "no-store" always;
}
location = /games/syezzhaem/catalog.json {
    alias /srv/foxygames/syezzhaem/catalog.json;
    open_file_cache off;
    add_header Cache-Control "no-store" always;
}
location ^~ /games/syezzhaem/releases/ {
    alias /srv/foxygames/syezzhaem/releases/;
    index index.html;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
location /api/syezzhaem/ {
    proxy_pass http://syezzhaem_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
}
