<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Герой — Runner Forge</title><style>*{box-sizing:border-box}body{margin:0;background:#87b7cf;font:14px system-ui;color:#edf0e4}canvas{width:100vw;height:100dvh;display:block;touch-action:none}.panel{position:fixed;left:16px;top:16px;padding:12px 15px;background:#26312bea;border:1px solid #b5b49b55;border-radius:12px;max-width:calc(100vw - 32px)}h1{font-size:18px;margin:0 0 7px}button,select{padding:7px 9px;margin:0 3px 4px 0;border:1px solid #96a28c;background:#39473b;color:#eef0e6;border-radius:6px;cursor:pointer}#status{display:block;font-size:12px;max-width:560px;color:#d7dfcf} @media(max-width:600px){.panel{left:8px;top:8px;padding:8px;max-width:calc(100vw - 16px)}h1{font-size:16px}button,select{font-size:12px;padding:6px}}</style></head><body><canvas id="game"></canvas><div class="panel"><h1>Герой — Runner Forge</h1><div><button id="closeup">Крупно</button><button id="camera">Игровая камера</button><select id="clip" aria-label="Анимация"><option value="idle">Ожидание</option><option value="run">Бег</option><option value="strafe_left">Влево</option><option value="strafe_right">Вправо</option><option value="hook_cast">Бросок</option><option value="hook_hold">Удержание</option><option value="hook_return_empty">Возврат</option><option value="hook_return_capture">Возврат с захватом</option><option value="death">Смерть</option></select></div><div><button id="start">Начало</button><button id="middle">Середина</button><button id="end">Конец</button><button id="pause">Пуск</button></div><div><button id="near">Цель 4 м</button><button id="far">Цель 25 м</button><button id="miss">Промах</button><button id="run">Забег</button></div><span id="status">Загрузка…</span></div><script type="module" src="/src/hero-preview.ts"></script></body></html>
