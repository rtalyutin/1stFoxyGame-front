name: Last Throne activation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: td-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activation:
    name: Last Throne activation guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Verify exact R3 activation and rejected counterexamples
        run: node --test hub/tests/activation.node.mjs
